name: Build ZEROnOisE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Node.js 24 を使用（20系の deprecation warning を解消）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── ソース取得 ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java 17 ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK / NDK / CMake ────────────────────────────────────────────
      # ubuntu-latest に ANDROID_HOME / sdkmanager がプリインストール済み。
      # 外部アクション (android-actions/setup-android, nttld/setup-ndk) を
      # 使わず直接 sdkmanager で管理することで Node.js 依存を排除する。
      - name: Install SDK components (NDK + CMake)
        run: |
          # sdkmanager のパスを明示
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # ライセンス一括承諾
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # 必要コンポーネントをインストール
          "$SDKMANAGER" \
            "platforms;android-29" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

          # パスを後続ステップに公開
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> $GITHUB_PATH

      # ── Gradle キャッシュ ────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── CMake FetchContent キャッシュ（minimp3 / libFLAC）───────────────────
      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      # ── local.properties 生成 ───────────────────────────────────────────────
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME"                     > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.3.11579264"  >> local.properties
          cat local.properties

      # ── Debug APK ビルド ────────────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pandroid.ndkVersion=26.3.11579264 \
            --stacktrace \
            --no-daemon

      # ── APK アップロード ────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROnOisE-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── ビルドサマリー ──────────────────────────────────────────────────────
      - name: Build Summary
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## ✅ Build Success" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK サイズ | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| ビルド番号 | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| コミット | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Actions → Artifacts** から APK をダウンロードできます。" >> $GITHUB_STEP_SUMMARY
