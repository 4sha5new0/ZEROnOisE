name: Build ZEROnOisE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 手動トリガーも可能

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── ソース取得 ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java 17 ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK ─────────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-29" \
            "build-tools;34.0.0" \
            "platform-tools"

      # ── Android NDK r26d ────────────────────────────────────────────────────
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      # ── CMake 3.22.1 ────────────────────────────────────────────────────────
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.1'

      # ── Gradle キャッシュ（ビルド高速化）───────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── CMake / FetchContent キャッシュ（minimp3 / libFLAC）────────────────
      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      # ── local.properties 生成 ───────────────────────────────────────────────
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      # ── Debug APK ビルド ────────────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pandroid.ndkVersion=26.3.11579264 \
            --stacktrace \
            --no-daemon

      # ── APK をアーティファクトとしてアップロード ────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROnOisE-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30   # 30日間保持

      # ── ビルド情報をサマリーに表示 ─────────────────────────────────────────
      - name: Build Summary
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## ✅ Build Success" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK サイズ | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| ビルド番号 | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| コミット | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Actions → Artifacts** から APK をダウンロードできます。" >> $GITHUB_STEP_SUMMARY
