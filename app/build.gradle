plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.audioplayer'
    compileSdk 34          // ← ライブラリのコンパイル要件を満たすため 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.zeronoise.player"
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName "0.1.0-alpha"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.core:core:1.10.1'
}

// kotlin-stdlib-jdk7/jdk8 (1.6.x) と kotlin-stdlib (1.8.x) の重複クラスを解消。
// 1.8.x の stdlib は jdk7/jdk8 の内容を内包済みなので全て同バージョンに統一する。
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10"
    }
}
